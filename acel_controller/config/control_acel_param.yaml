controller_server:
  ros__parameters:
    controller_plugins: ["FollowPath"]

    FollowPath:
      plugin: "acel_pure_pursuit_controller::PurePursuitController"
      debug_trajectory_details: True
      desired_linear_vel: 2
      lookahead_dist: 0.5
      max_angular_vel: 1.0
      transform_tolerance: 1.0